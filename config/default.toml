# Marv configuration — a YMLX-powered local coding agent.
#
# Copy to ~/.marv/config.toml and customize, or set per-project in `./.marv/`.

# YMLX is the model backend: models are managed by the ymlx CLI and served on
# localhost:11500 (see config.marv for details).
provider = "ymlx"

# Leave unset to use the currently-serving YMLX model, or set the model id of a
# ymlx-managed model (e.g. "mlx-community/Qwen3.5-4B-MLX-4bit").
model = ""

# Local YMLX endpoint (no API key required).
base_url = "http://localhost:11500"

# Maximum tokens for context window
context_max_tokens = 128000

# Maximum tokens for a single model response
max_output_tokens = 8192

# Temperature for generation (0.0-1.0)
temperature = 0.7

# Thinking level: off, minimal, low, medium, high (model-family dependent)
thinking_level = "off"

# Session + state directories (defaults to ~/.cache/marv).
# session_dir = "~/.cache/marv/sessions"
# skills_dirs = ["~/.cache/marv/skills"]
# context_file_paths = ["~/.cache/marv/context.md"]

[providers.ymlx]
base_url = "http://localhost:11500"
