# Marv configuration — a local, MLX-first coding agent.
#
# Copy to ~/.marv/config.toml and customize, or set per-project in `./.marv/`.

# Backend: "marv-mlx" (local MLX models via mlx-vlm) or "apple-fm"
# (Apple's built-in Foundation Model on macOS 27+).
provider = "marv-mlx"

# Leave unset to use the currently-loaded MLX model, or set a model id
# (e.g. "mlx-community/Qwen3.5-4B-MLX-4bit").
model = ""

# Local model server endpoint. Leave unset to use the backend's default
# (marv-mlx: http://localhost:11500, apple-fm: http://127.0.0.1:1976).
# base_url = "http://localhost:11500"

# Maximum tokens for context window
context_max_tokens = 128000

# Maximum tokens for a single model response
max_output_tokens = 8192

# Temperature for generation (0.0-1.0)
temperature = 0.7

# Thinking level: off, minimal, low, medium, high (model-family dependent)
thinking_level = "off"

# Tool approval: off (run everything), destructive (ask before write/edit/risky
# shell commands), or all (ask before every tool call).
approval_mode = "off"

# Session + state directories (defaults to ~/.cache/marv).
# session_dir = "~/.cache/marv/sessions"
# skills_dirs = ["~/.cache/marv/skills"]
# context_file_paths = ["~/.cache/marv/context.md"]

[providers.marv-mlx]
base_url = "http://localhost:11500"
# model = "mlx-community/Qwen3.5-4B-MLX-4bit"

# Apple Foundation Model (macOS 27+). Run `sudo fm license` once to enable it.
# provider = "apple-fm"
# model = "system"          # "system" (on-device) or "pcc" (Private Cloud Compute)
[providers.apple-fm]
base_url = "http://127.0.0.1:1976"
