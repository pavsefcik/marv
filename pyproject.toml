[project]
name = "marv"
dynamic = ["version"]
description = "A local-first coding agent TUI for Apple Silicon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pavelsefcik", email = "187490479+pavsefcik@users.noreply.github.com" }]
keywords = ["coding-agent", "llm", "mlx", "apple-silicon", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
    "tiktoken>=0.14.0",
]

[project.scripts]
marv = "marv.cli:main"

[project.urls]
Homepage = "https://github.com/pavsefcik/marv"
Repository = "https://github.com/pavsefcik/marv"
Issues = "https://github.com/pavsefcik/marv/issues"
Changelog = "https://github.com/pavsefcik/marv/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[tool.hatch.build.targets.wheel]
packages = ["src/marv"]
