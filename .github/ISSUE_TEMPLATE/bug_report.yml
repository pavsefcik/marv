name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this for security issues — see
        [SECURITY.md](https://github.com/pavsefcik/marv/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `make run`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: marv version
      description: Output of `marv --version`
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - marv-mlx
        - apple-fm
        - other / not sure
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model id in use, if relevant
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any error output or session excerpt.
      render: text
